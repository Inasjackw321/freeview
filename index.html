<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeView - Live Chat</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Background Animation -->
    <div class="background-animation">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <!-- Header -->
    <header class="header glass">
        <div class="logo">
            <i class="fas fa-comments"></i>
            <span>FreeView Chat</span>
        </div>
        <div class="header-info">
            <i class="fas fa-user-circle"></i>
            <span>Anonymous</span>
            <i class="fas fa-check-circle verified" title="Verified"></i>
        </div>
    </header>

    <!-- Chat Container -->
    <div class="chat-container">
        <div class="chat-header glass">
            <span><i class="fas fa-comments"></i> Live Chat</span>
            <span class="online-count"><i class="fas fa-circle" style="font-size: 0.6rem; color: #4ade80;"></i> Live</span>
        </div>
        <div style="position: relative; flex: 1; overflow: hidden;">
            <div class="message-count" id="messageCount">0 messages</div>
            <div class="chat-messages" id="chatMessages">
                <!-- Messages will be inserted here -->
                <div class="typing-indicator" id="typingIndicator">
                    <div class="message-avatar" style="background: #667eea;">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="typing-dots">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            </div>
            <button class="scroll-to-bottom" id="scrollToBottom">
                <i class="fas fa-arrow-down"></i>
            </button>
        </div>
    </div>

    <!-- Message Input -->
    <div class="message-input-container glass">
        <button class="image-btn" id="imageBtn" title="Send Image">
            <i class="fas fa-image"></i>
        </button>
        <input type="file" id="imageInput" accept="image/*" style="display: none;">
        <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
        <button class="send-btn" id="sendBtn">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>

    <!-- Image Preview Modal -->
    <div class="modal" id="imagePreviewModal">
        <div class="modal-overlay"></div>
        <div class="modal-content glass" style="max-width: 90%; max-height: 90vh; overflow: auto;">
            <button class="close-btn" id="closePreviewModal">
                <i class="fas fa-times"></i>
            </button>
            <img id="previewImage" style="width: 100%; height: auto; border-radius: 1rem;">
        </div>
    </div>

    <!-- Loading Spinner -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage"></span>
    </div>

    <script src="app.js"></script>
</body>
</html>
